name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tags are required for release versioning and GitHub Releases.
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default `tools` package no longer exists in the SDK
          # repository; installing only platform-tools lets it succeed.
          packages: platform-tools

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SEMVER="${TAG%%-*}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$SEMVER"
          MAJOR="${MAJOR:-0}"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"
          CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          echo "VERSION_NAME=$TAG" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build APKs
        run: |
          set -e
          VERSION_ARGS="${VERSION_NAME:+-PversionName=$VERSION_NAME -PversionCode=$VERSION_CODE}"
          mkdir -p dist

          ./gradlew :app:assembleDebug :testapp:assembleDebug \
            -PnestspaceHostAbi=universal $VERSION_ARGS --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk dist/NestSpace-universal.apk

          ./gradlew :app:assembleDebug -PnestspaceHostAbi=arm64 \
            $VERSION_ARGS --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk dist/NestSpace-arm64.apk

          ./gradlew :app:assembleDebug -PnestspaceHostAbi=x86_64 \
            $VERSION_ARGS --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk dist/NestSpace-x86_64.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: nestspace-debug
          path: |
            dist/*.apk
            testapp/build/outputs/apk/debug/testapp-debug.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Name tagged APKs
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp dist/NestSpace-universal.apk "NestSpace-${GITHUB_REF_NAME}-universal.apk"
          cp dist/NestSpace-arm64.apk "NestSpace-${GITHUB_REF_NAME}-arm64.apk"
          cp dist/NestSpace-x86_64.apk "NestSpace-${GITHUB_REF_NAME}-x86_64.apk"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NestSpace-*.apk
          generate_release_notes: true
